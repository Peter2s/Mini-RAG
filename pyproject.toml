[project]
name = "mini-rag"
version = "0.1.0"
description = "A minimal Retrieval-Augmented Generation API built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pypdf>=4.2",  # required by LangChain's PyPDFLoader
    "anthropic>=1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
]

[project.optional-dependencies]
# Semantic embeddings with EMBEDDING_PROVIDER=voyage
voyage = ["voyageai>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:`langchain-community` is being sunset:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI's File(...) / Query(...) defaults
