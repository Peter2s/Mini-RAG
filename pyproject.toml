[project]
name = "mini-rag"
version = "0.1.0"
description = "A minimal Retrieval-Augmented Generation API built with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "pypdf>=4.2",  # required by LangChain's PyPDFLoader
    "anthropic>=1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pymongo>=4.18.2",
]

[project.optional-dependencies]
# Semantic embeddings with EMBEDDING_PROVIDER=voyage
voyage = ["voyageai>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff==0.16.9",
    "pre-commit>=4.6.2",
    "mypy>=2.3.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:`langchain-community` is being sunset:DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # pep8 naming
    "UP",       # modern Python syntax
    "B",        # likely bugs
    "SIM",      # simplifications
    "C4",       # comprehensions
    "C90",      # cyclomatic complexity
    "RUF",      # ruff-specific rules
    "PIE",      # unnecessary code
    "RET",      # return statements
    "PTH",      # pathlib over os.path
    "PERF",     # performance anti-patterns
    "S",        # security (bandit)
    "ASYNC",    # async pitfalls
    "FAST",     # FastAPI
    "PT",       # pytest style
    "T20",      # stray print()
    "ERA",      # commented-out code
    "LOG", "G", # logging
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks things
    "S108",  # fixed /tmp paths in fixtures are fine in tests
]

[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["voyageai", "voyageai.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = false
warn_required_dynamic_aliases = true

[tool.typos.files]
extend-exclude = ["uv.lock"]  # package names like `certifi` aren't typos

[tool.typos.default.extend-words]
caf = "caf"  # "café" split around an escaped byte in tests/test_file_loader.py
